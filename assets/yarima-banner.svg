<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">Yarima Tamang — Computer Science and Software Engineering</title>
<desc id="desc">An understated charcoal developer banner with editorial typography, a small terminal window, code-inspired linework, and restrained teal accents.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b0f14"/>
    <stop offset=".62" stop-color="#101820"/>
    <stop offset="1" stop-color="#111a20"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5eead4"/>
    <stop offset="1" stop-color="#78a9ff"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#c4d2df" stroke-opacity=".035" stroke-width="1"/>
  </pattern>
</defs>
<rect width="1200" height="400" rx="22" fill="url(#bg)"/>
<rect width="1200" height="400" rx="22" fill="url(#grid)"/>
<rect x="42" y="44" width="4" height="312" rx="2" fill="url(#accent)"/>
<text x="76" y="91" fill="#75e6d4" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2.8">COMPUTER SCIENCE  /  ENGINEERING</text>
<text x="72" y="157" fill="#f3f4f6" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700" letter-spacing="-1.2">Yarima Tamang</text>
<text x="76" y="199" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="21">AI / ML  ·  Deep Learning  ·  Software Engineering</text>
<text x="76" y="250" fill="#e2e8f0" font-family="Arial, Helvetica, sans-serif" font-size="18">I build, test, and improve practical solutions.</text>
<text x="76" y="279" fill="#9aa9b8" font-family="Arial, Helvetica, sans-serif" font-size="16">Curiosity first. Clear thinking. Measurable progress.</text>
<rect x="76" y="313" width="270" height="2" rx="1" fill="url(#accent)"/>
<text x="76" y="342" fill="#718096" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="1.7">LEARN  /  BUILD  /  ITERATE</text>
<!-- A deliberately simple terminal illustration, not a generic AI/globe motif. -->
<g transform="translate(690 76)">
  <rect x="0" y="0" width="440" height="244" rx="12" fill="#0a1016" stroke="#2a3b47" stroke-width="1.5"/>
  <path d="M0 42H440" stroke="#2a3b47" stroke-width="1.5"/>
  <circle cx="22" cy="21" r="4" fill="#fb7185"/>
  <circle cx="38" cy="21" r="4" fill="#fbbf24"/>
  <circle cx="54" cy="21" r="4" fill="#5eead4"/>
  <text x="76" y="25" fill="#8ea0af" font-family="Arial, Helvetica, sans-serif" font-size="11">workspace / projects</text>
  <g font-family="Consolas, Menlo, monospace" font-size="15">
    <text x="26" y="79" fill="#64748b">01</text><text x="61" y="79" fill="#5eead4">const</text><text x="116" y="79" fill="#e2e8f0"> build = () =&gt; {</text>
    <text x="26" y="111" fill="#64748b">02</text><text x="61" y="111" fill="#c4b5fd">  explore</text><text x="130" y="111" fill="#e2e8f0">("ideas");</text>
    <text x="26" y="143" fill="#64748b">03</text><text x="61" y="143" fill="#c4b5fd">  test</text><text x="107" y="143" fill="#e2e8f0">("assumptions");</text>
    <text x="26" y="175" fill="#64748b">04</text><text x="61" y="175" fill="#c4b5fd">  improve</text><text x="130" y="175" fill="#e2e8f0">("results");</text>
    <text x="26" y="207" fill="#64748b">05</text><text x="61" y="207" fill="#e2e8f0">};</text>
  </g>
  <rect x="26" y="222" width="8" height="2" fill="#5eead4"/>
  <text x="44" y="228" fill="#718096" font-family="Consolas, Menlo, monospace" font-size="10">ready for the next iteration</text>
</g>
<path d="M656 92V309" stroke="#243640" stroke-width="1"/>
<circle cx="656" cy="92" r="3" fill="#5eead4"/>
<circle cx="656" cy="309" r="3" fill="#78a9ff"/>
</svg>